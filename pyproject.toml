[project]
name = "emporio-musica-chatbot"
version = "0.1.0"
description = "Agente de atendimento da Empório da Música (RAG + LangGraph)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Agent orchestration
    "langchain>=1.0",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=2.0",
    # RAG: PDF parsing, chunking, embeddings, vector store
    "pymupdf4llm>=0.0.17",
    "langchain-text-splitters>=1.0",
    "langchain-huggingface>=1.0",
    "sentence-transformers>=3.0",
    "langchain-chroma>=1.0",
    # Structured data
    "pandas>=2.2",
    # Config and CLI
    "pydantic-settings>=2.5",
    "rich>=13.9",
    "langchain-openrouter>=0.2.9",
    "rapidocr>=3.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emporio"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "langgraph-cli[inmem]>=0.4",
]
